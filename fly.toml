# Fly.io deployment. One always-running machine with a persistent volume for SQLite.
app = "devin-conductor"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_PATH = "/data/devin-conductor.sqlite"
  WORKER_ENABLED = "true"
  TRUST_PROXY_SECURE_COOKIES = "true"
  LOG_LEVEL = "info"

[mounts]
  source = "conductor_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite plus a single worker means exactly one machine, always running.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
